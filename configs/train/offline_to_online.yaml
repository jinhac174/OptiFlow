mode: offline_to_online

offline_max_steps: 1000000
online_max_steps:  1000000
max_steps:         2000000

batch_size: 256

log_interval:  5000
eval_interval: 20000
save_interval: 100000

# Unified replay buffer (FQL-style, paper App. C.2): pre-seeded with the offline
# dataset, online transitions are appended uniformly. Capacity is sized at run
# time to max(this, dataset_size + online_max_steps + 1) so offline data is
# never overwritten.
replay_buffer_capacity: 2000000

# Optional: skip the offline phase and resume online training from a saved
# checkpoint dir.
resume_from: null
