name: e014_sensitivity_cube_double_rest
description: e011 interrupted jobs resubmit — w=2.0/eta=1e-2/seed=8, w=4.0/eta=1e-3/seed=6 (2 jobs)
env_set: ogbench

jobs:
  - agent.w_temperature: 2.0
    agent.eta_temperature: 1e-2
    seed: 8
  - agent.w_temperature: 4.0
    agent.eta_temperature: 1e-3
    seed: 6

fixed:
  env: cube_double_play_task2
  agent.agent_file: agent_fpot
  agent.q_agg: mean
  agent.use_vabc_td_target: true
  train.batch_size: 256
  train.max_steps: 1000000
  train.eval_interval: 20000
  eval.num_eval_episodes: 100
  logging.wandb_project: sensitivity_fpot_cube_double_play
  logging.wandb_project_append_date: true
  logging.save_checkpoint: false

slurm:
  time: "48:00:00"
  mem: "32G"
  cpus_per_task: 4
  partitions:
    - base_suma_rtx3090
    - dell_rtx3090
    - suma_rtx4090
    - suma_a6000
    - gigabyte_a6000
    - gigabyte_a5000
    - asus_pro6000
    - suma_pro6000
    - asus_6000ada
    - tyan_a6000
    - asus_a5000
