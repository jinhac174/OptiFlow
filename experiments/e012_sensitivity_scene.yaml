name: e012_sensitivity_scene
description: FPOT hyperparameter sensitivity (w_temperature × eta_temperature) on scene_play_task2 — 3 × 3 × 8 seeds = 72 jobs
env_set: ogbench

sweep:
  agent.w_temperature: [1.0, 2.0, 4.0]
  agent.eta_temperature: [1e-2, 1e-1, 1e0]
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: scene_play_task2
  agent.agent_file: agent_fpot
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  train.batch_size: 256
  train.max_steps: 1000000
  train.eval_interval: 20000
  eval.num_eval_episodes: 100
  logging.wandb_project: sensitivity_fpot_scene_play_td_false
  logging.wandb_project_append_date: true
  logging.save_checkpoint: false

slurm:
  time: "48:00:00"
  mem: "32G"
  cpus_per_task: 4
  qos: big_qos
  partitions:
    - base_suma_rtx3090
    - dell_rtx3090
    - suma_rtx4090
    - suma_a6000
    - gigabyte_a6000
    - gigabyte_a5000
    - asus_6000ada
    - tyan_a6000
    - asus_a5000
