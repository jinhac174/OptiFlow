name: fpot_ablation_qmax_puzzle_4x4
description: lambda_q ablation on puzzle-4x4-play-task1 (4 x 8 seeds = 32 jobs)
wandb_project: fpot_ablation_qmax

sweep:
  agent.lambda_q: [0.0, 0.1, 1.0, 3.0]
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  env.env_name: puzzle-4x4-play-singletask-task1-v0
  agent: fpot
  agent.w_temperature: 2.0
  agent.eta_temperature: 0.0001
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.discount: 0.99
  train.max_steps: 1000000
  train.eval_interval: 20000
