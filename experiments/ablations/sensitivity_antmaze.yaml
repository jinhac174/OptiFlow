name: fpot_ablation_sensitivity_antmaze
description: Sensitivity tau* x eta* on antmaze-large-navigate-task1 (3 x 3 x 8 seeds = 72 jobs)
wandb_project: fpot_ablation_sensitivity

sweep:
  agent.w_temperature: [1, 2, 4]
  agent.eta_temperature: [0.001, 0.01, 0.1]
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  env.env_name: antmaze-large-navigate-singletask-task1-v0
  agent: fpot
  agent.q_agg: min
  agent.use_vabc_td_target: false
  agent.discount: 0.995
  train.max_steps: 1000000
  train.eval_interval: 20000
