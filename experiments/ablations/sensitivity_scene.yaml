name: fpot_ablation_sensitivity_scene
description: Sensitivity tau* x eta* on scene-play-task2 (3 x 3 x 8 seeds = 72 jobs)
env_set: ogbench
wandb_project: fpot_ablation_sensitivity_scene

sweep:
  agent.w_temperature: [0.5, 1, 2]
  agent.eta_temperature: [0.001, 0.01, 0.1]
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  env.env_name: scene-play-singletask-task2-v0
  agent: fpot
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.discount: 0.99
  train.max_steps: 1000000
  train.eval_interval: 20000

slurm:
  time: "72:00:00"
  mem: "64G"
  cpus_per_task: 20
  qos: big_qos
  partitions:
    - base_suma_rtx3090
    - big_suma_rtx3090
    - dell_rtx3090
    - suma_rtx4090
    - suma_a6000
    - gigabyte_a6000
    - gigabyte_a5000
    - asus_6000ada
    - asus_a5000
    - tyan_a6000
