name: fpot_ablation_nm_antmaze
description: N x M ablation on antmaze-large-navigate-task1 (4 N x 4 M x 8 seeds = 128 jobs)
wandb_project: fpot_ablation_nm

sweep:
  agent.n_teacher: [4, 16, 64, 256]
  agent.n_student: [4, 8, 16, 32]
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  env.env_name: antmaze-large-navigate-singletask-task1-v0
  agent: fpot
  agent.w_temperature: 2.0
  agent.eta_temperature: 0.01
  agent.q_agg: min
  agent.use_vabc_td_target: false
  agent.discount: 0.995
  train.max_steps: 1000000
  train.eval_interval: 20000
