name: fpot_ablation_qmax_cube_double
description: lambda_q ablation on cube-double-play-task2 (paper Tab. 11), 3 non-default lambda_q x 8 seeds = 24 jobs; default 0.0 omitted (already in main results)
wandb_project: fpot_ablation_qmax

sweep:
  agent.lambda_q: [0.001, 0.01, 0.1]
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  env.env_name: cube-double-play-singletask-task2-v0
  agent: fpot
  agent.w_temperature: 2.0
  agent.eta_temperature: 0.01
  agent.q_agg: mean
  agent.use_vabc_td_target: true
  agent.discount: 0.99
  train: offline
  train.max_steps: 1000000
  train.eval_steps: [800000, 900000, 1000000]
  logging.save_csv: false
  logging.save_config: false
  logging.save_checkpoint: false
