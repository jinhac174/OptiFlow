name: e016_smoke_offto_cube_double
description: Smoke test — resume from 1M checkpoint, online phase only, balanced sampling, no exploration noise
env_set: ogbench
wandb_project: flowrl-ogbench-off2on-smoke

sweep:
  seed: [5]

fixed:
  env: cube_double_play_task2
  agent.agent_file: agent_online
  agent.q_agg: mean
  agent.use_vabc_td_target: true
  agent.w_temperature: 2.0
  agent.eta_temperature: 1e-2
  agent.n_student: 16
  agent.n_teacher: 64
  train: offline_to_online
  train.offline_max_steps: 1000000
  train.online_max_steps:  1000000
  train.max_steps:         2000000
  train.batch_size: 256
  train.eval_interval: 100000
  train.log_interval:   5000
  train.save_interval: 200000
  train.num_collection_envs: 8
  train.replay_buffer_capacity: 9000000
  train.warmup_random_steps: 0
  train.start_training_step: 1000
  train.utd_ratio: 1
  train.balanced_sampling: false
  train.resume_from: /scratch2/danielc174/suot/outputs/cube_double_play/e014_offto_cube_double/base/seed_5/run_03/agent_step_1000000
  eval.num_eval_episodes: 100
  logging.save_checkpoint: false

slurm:
  time: "16:00:00"
  mem: "48G"
  cpus_per_task: 4
  qos: big_qos
  partitions:
    - big_suma_rtx3090
    - base_suma_rtx3090
    - dell_rtx3090
    - suma_rtx4090
    - suma_a6000
    - gigabyte_a6000
    - gigabyte_a5000
    - asus_6000ada
    - tyan_a6000
    - asus_a5000
