name: e013c_nm_ablation_antmaze_N32M256
description: FPOT N×M ablation on antmaze_large_navigate_task1 — N=32, M=256, 8 seeds (VastAI)
env_set: ogbench
wandb_project: flowrl-ogbench-nm-antmaze

sweep:
  agent.n_student: [32]
  agent.n_teacher: [256]
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: antmaze_large_navigate_task1
  agent.agent_file: agent_fpot
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.w_temperature: 2.0
  agent.eta_temperature: 1e-2
  train.batch_size: 256
  train.max_steps: 1000000
  train.eval_interval: 20000
  eval.num_eval_episodes: 100
  logging.save_checkpoint: false
