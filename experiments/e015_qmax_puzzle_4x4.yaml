name: e015_qmax_puzzle_4x4
description: FPOT Q-max ablation on puzzle_4x4_play_task1, lambda_q sweep, 8 seeds
env_set: ogbench
wandb_project: flowrl-ogbench-qmax

sweep:
  agent.lambda_q: [0.1, 0.01, 0.001]
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: puzzle_4x4_play_task1
  agent.agent_file: agent_fpot
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.w_temperature: 2.0
  agent.eta_temperature: 1e-4
  agent.n_student: 16
  agent.n_teacher: 64
  train.batch_size: 256
  train.max_steps: 1000000
  train.eval_interval: 20000
  eval.num_eval_episodes: 100
  logging.save_checkpoint: false
