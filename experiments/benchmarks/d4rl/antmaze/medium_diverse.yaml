name: optiflow_d4rl_antmaze_medium_diverse
description: OptiFlow on D4RL antmaze-medium-diverse-v2, seeds 1-8, 500K steps (paper Tab. 5; CDQL=true)
wandb_project: optiflow_d4rl_benchmark

sweep:
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: d4rl_antmaze
  env.env_name: antmaze-medium-diverse-v2
  agent: optiflow
  agent.w_temperature: 2.0
  agent.eta_temperature: 0.0001
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.discount: 0.99
  train.max_steps: 500000
  train.eval_interval: 20000
