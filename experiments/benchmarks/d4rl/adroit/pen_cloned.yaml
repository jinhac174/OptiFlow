name: optiflow_d4rl_adroit_pen_cloned
description: OptiFlow on D4RL pen-cloned-v1, seeds 1-8, 500K steps (paper Tab. 5; CDQL=true)
wandb_project: optiflow_d4rl_benchmark

sweep:
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: d4rl_adroit
  env.env_name: pen-cloned-v1
  agent: optiflow
  agent.w_temperature: 5.0
  agent.eta_temperature: 0.001
  agent.q_agg: min
  agent.use_vabc_td_target: false
  agent.discount: 0.99
  train.max_steps: 500000
  train.eval_interval: 20000
