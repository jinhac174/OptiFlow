name: fpot_ogbench_cube_triple
description: FPOT on OGBench cube-triple-play, tasks 1-5, seeds 1-8 (VaBC TD)
wandb_project: fpot_ogbench_benchmark

sweep:
  env.env_name:
    - cube-triple-play-singletask-task1-v0
    - cube-triple-play-singletask-task2-v0
    - cube-triple-play-singletask-task3-v0
    - cube-triple-play-singletask-task4-v0
    - cube-triple-play-singletask-task5-v0
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  agent: fpot
  agent.w_temperature: 1.0
  agent.eta_temperature: 1e-05
  agent.q_agg: mean
  agent.use_vabc_td_target: true
  agent.discount: 0.99
  train.max_steps: 1000000
  train.eval_interval: 20000
