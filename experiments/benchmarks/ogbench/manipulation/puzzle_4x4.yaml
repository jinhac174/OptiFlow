name: fpot_ogbench_puzzle_4x4
description: FPOT on OGBench puzzle-4x4-play, tasks 1-5, seeds 1-8
wandb_project: fpot_ogbench_benchmark

sweep:
  env.env_name:
    - puzzle-4x4-play-singletask-task1-v0
    - puzzle-4x4-play-singletask-task2-v0
    - puzzle-4x4-play-singletask-task3-v0
    - puzzle-4x4-play-singletask-task4-v0
    - puzzle-4x4-play-singletask-task5-v0
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  agent: fpot
  agent.w_temperature: 2.0
  agent.eta_temperature: 0.0001
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.discount: 0.99
  train.max_steps: 1000000
  train.eval_interval: 20000
