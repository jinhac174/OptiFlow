name: optiflow_ogbench_cube_double
description: OptiFlow on OGBench cube-double-play, tasks 1-5, seeds 1-8 (VaBC TD)
wandb_project: optiflow_ogbench_benchmark

sweep:
  env.env_name:
    - cube-double-play-singletask-task1-v0
    - cube-double-play-singletask-task2-v0
    - cube-double-play-singletask-task3-v0
    - cube-double-play-singletask-task4-v0
    - cube-double-play-singletask-task5-v0
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  agent: optiflow
  agent.w_temperature: 2.0
  agent.eta_temperature: 0.01
  agent.q_agg: mean
  agent.use_vabc_td_target: true
  agent.discount: 0.99
  train.max_steps: 1000000
  train.eval_interval: 20000
