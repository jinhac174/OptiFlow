name: fpot_ogbench_visual_puzzle_4x4
description: FPOT on visual OGBench puzzle-4x4-play task1, seeds 1-4, 500K steps (paper hparams not specified; defaults from state-based puzzle_4x4)
env_set: ogbench
wandb_project: fpot_ogbench_visual_puzzle_4x4

sweep:
  env.env_name:
    - visual-puzzle-4x4-play-singletask-task1-v0
  seed: [1, 2, 3, 4]

fixed:
  env: ogbench_visual
  agent: fpot
  agent.w_temperature: 2.0
  agent.eta_temperature: 0.0001
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.discount: 0.99
  train.max_steps: 500000
  train.eval_interval: 20000
  agent.encoder: impala_small
  agent.p_aug: 0.5

slurm:
  time: "72:00:00"
  mem: "64G"
  cpus_per_task: 20
  qos: big_qos
  partitions:
    - base_suma_rtx3090
    - big_suma_rtx3090
    - dell_rtx3090
    - suma_rtx4090
    - suma_a6000
    - gigabyte_a6000
    - gigabyte_a5000
    - asus_6000ada
    - asus_a5000
    - tyan_a6000
