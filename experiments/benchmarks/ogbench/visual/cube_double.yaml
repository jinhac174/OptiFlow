name: fpot_ogbench_visual_cube_double
description: FPOT on visual OGBench cube-double-play task1, seeds 1-4, 500K steps
wandb_project: fpot_ogbench_benchmark

sweep:
  env.env_name:
    - visual-cube-double-play-singletask-task1-v0
  seed: [1, 2, 3, 4]

fixed:
  env: ogbench_visual
  agent: fpot
  agent.w_temperature: 2.0
  agent.eta_temperature: 0.01
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.discount: 0.99
  train.max_steps: 500000
  train.eval_interval: 20000
  agent.encoder: impala_small
  agent.p_aug: 0.5
