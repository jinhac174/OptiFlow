name: optiflow_ogbench_humanoidmaze_medium
description: OptiFlow on OGBench humanoidmaze-medium-navigate, tasks 1-5, seeds 1-8 (VaBC TD, gamma=0.995)
wandb_project: optiflow_ogbench_benchmark

sweep:
  env.env_name:
    - humanoidmaze-medium-navigate-singletask-task1-v0
    - humanoidmaze-medium-navigate-singletask-task2-v0
    - humanoidmaze-medium-navigate-singletask-task3-v0
    - humanoidmaze-medium-navigate-singletask-task4-v0
    - humanoidmaze-medium-navigate-singletask-task5-v0
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  agent: optiflow
  agent.w_temperature: 1.0
  agent.eta_temperature: 0.001
  agent.q_agg: mean
  agent.use_vabc_td_target: true
  agent.discount: 0.995
  train.max_steps: 1000000
  train.eval_interval: 20000
