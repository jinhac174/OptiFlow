name: fpot_ogbench_antmaze_giant
description: FPOT on OGBench antmaze-giant-navigate, tasks 1-5, seeds 1-8 (paper Tab. 4 row 2; CDQL=true, gamma=0.995)
wandb_project: fpot_ogbench_benchmark

sweep:
  env.env_name:
    - antmaze-giant-navigate-singletask-task1-v0
    - antmaze-giant-navigate-singletask-task2-v0
    - antmaze-giant-navigate-singletask-task3-v0
    - antmaze-giant-navigate-singletask-task4-v0
    - antmaze-giant-navigate-singletask-task5-v0
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  agent: fpot
  agent.w_temperature: 1.0
  agent.eta_temperature: 0.001
  agent.q_agg: min
  agent.use_vabc_td_target: false
  agent.discount: 0.995
  train.max_steps: 1000000
  train.eval_interval: 20000
