name: fpot_ogbench_humanoidmaze_large
description: FPOT on OGBench humanoidmaze-large-navigate, tasks 1-5, seeds 1-8 (gamma=0.999)
wandb_project: fpot_ogbench_benchmark

sweep:
  env.env_name:
    - humanoidmaze-large-navigate-singletask-task1-v0
    - humanoidmaze-large-navigate-singletask-task2-v0
    - humanoidmaze-large-navigate-singletask-task3-v0
    - humanoidmaze-large-navigate-singletask-task4-v0
    - humanoidmaze-large-navigate-singletask-task5-v0
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  agent: fpot
  agent.w_temperature: 2.0
  agent.eta_temperature: 0.1
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.discount: 0.999
  train.max_steps: 1000000
  train.eval_interval: 20000
