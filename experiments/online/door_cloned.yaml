name: optiflow_online_door_cloned
description: Offline-to-online OptiFlow on D4RL door-cloned-v1 (1M offline + 1M online, seeds 1-8)
wandb_project: optiflow_online

sweep:
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: d4rl_adroit
  env.env_name: door-cloned-v1
  agent: optiflow
  agent.w_temperature: 1.0
  agent.eta_temperature: 1e-05
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.discount: 0.99
  train: offline_to_online
  train.offline_max_steps: 1000000
  train.online_max_steps: 1000000
  train.eval_interval: 50000
