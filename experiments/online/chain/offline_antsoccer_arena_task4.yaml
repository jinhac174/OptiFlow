name: fpot_offline_antsoccer_arena_task4
description: Offline-only FPOT on antsoccer-arena task4, seeds 1-8 (1M steps, saves final_agent for chained online resume)
wandb_project: fpot_offline_chain

sweep:
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  env.env_name: antsoccer-arena-navigate-singletask-task4-v0
  agent: fpot
  agent.w_temperature: 1.0
  agent.eta_temperature: 0.01
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.discount: 0.995
  train: offline
  train.max_steps: 1000000
  train.eval_interval: 50000
  train.save_interval: 9999999
  logging.save_checkpoint: true
