name: fpot_offline_antmaze_large_play
description: Offline-only FPOT on D4RL antmaze-large-play-v2, 1M steps, 8 seeds (paper Tab. 5; CDQL=true; saves final_agent for chained online resume)
wandb_project: fpot_offline_for_resume
wandb_project_online: fpot_online_resume

sweep:
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: d4rl_antmaze
  env.env_name: antmaze-large-play-v2
  agent: fpot
  agent.w_temperature: 0.5
  agent.eta_temperature: 1e-05
  agent.q_agg: min
  agent.use_vabc_td_target: false
  agent.discount: 0.99
  train: offline
  train.max_steps: 1000000
  train.eval_interval: 50000
  train.save_interval: 9999999  # disable periodic saves; only final_agent at 1M
  logging.save_checkpoint: true
