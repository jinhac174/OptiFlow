name: fpot_offline_hammer_cloned_v1
description: Offline-only FPOT on D4RL hammer-cloned-v1, 1M steps, 8 seeds (paper sweep tau=0.5 eta=0.001 q_agg=mean; saves final_agent for chained online resume)
wandb_project: fpot_offline_for_resume
wandb_project_online: fpot_online_resume

sweep:
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: d4rl_adroit
  env.env_name: hammer-cloned-v1
  agent: fpot
  agent.w_temperature: 0.5
  agent.eta_temperature: 0.001
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.discount: 0.99
  train: offline
  train.max_steps: 1000000
  train.eval_interval: 50000
  train.save_interval: 9999999
  logging.save_checkpoint: true
