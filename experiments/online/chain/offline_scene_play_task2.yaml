name: fpot_offline_scene_play_task2
description: Offline-only FPOT on scene-play task2, seeds 1-8 (1M steps, saves final_agent for chained online resume)
wandb_project: fpot_offline_for_resume
wandb_project_online: fpot_online_resume

sweep:
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  env.env_name: scene-play-singletask-task2-v0
  agent: fpot
  agent.w_temperature: 1.0
  agent.eta_temperature: 0.01
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.discount: 0.99
  train: offline
  train.max_steps: 1000000
  train.eval_interval: 50000
  train.save_interval: 9999999
  logging.save_checkpoint: true
