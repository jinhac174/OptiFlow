name: fpot_online_antsoccer_arena
description: Offline-to-online FPOT on antsoccer-arena-navigate-task1 (1M offline + 1M online, seeds 1-8)
wandb_project: fpot_online

sweep:
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  env.env_name: antsoccer-arena-navigate-singletask-task1-v0
  agent: fpot
  agent.w_temperature: 1.0
  agent.eta_temperature: 0.01
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.discount: 0.995
  agent.critic_update_interval: 5
  train: offline_to_online
  train.offline_max_steps: 1000000
  train.online_max_steps: 1000000
  train.eval_interval: 50000
