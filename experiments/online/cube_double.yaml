name: fpot_online_cube_double
description: Offline-to-online FPOT on cube-double-play-task2 (1M offline + 1M online, seeds 1-8)
env_set: ogbench
wandb_project: fpot_online

sweep:
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  env.env_name: cube-double-play-singletask-task2-v0
  agent: fpot
  agent.agent_file: agent_online
  agent.w_temperature: 2.0
  agent.eta_temperature: 0.01
  agent.q_agg: mean
  agent.use_vabc_td_target: true
  agent.discount: 0.99
  train: offline_to_online
  train.offline_max_steps: 1000000
  train.online_max_steps: 1000000
  train.eval_interval: 50000

slurm:
  time: "72:00:00"
  mem: "64G"
  cpus_per_task: 20
  qos: big_qos
  partitions:
    - base_suma_rtx3090
    - big_suma_rtx3090
    - dell_rtx3090
    - suma_rtx4090
    - suma_a6000
    - gigabyte_a6000
    - gigabyte_a5000
    - asus_6000ada
    - asus_a5000
    - tyan_a6000
