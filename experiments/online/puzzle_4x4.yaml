name: optiflow_online_puzzle_4x4
description: Offline-to-online OptiFlow on puzzle-4x4-play-task4 (1M offline + 1M online, seeds 1-8)
wandb_project: optiflow_online

sweep:
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  env.env_name: puzzle-4x4-play-singletask-task4-v0
  agent: optiflow
  agent.w_temperature: 2.0
  agent.eta_temperature: 0.01
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.discount: 0.99
  train: offline_to_online
  train.offline_max_steps: 1000000
  train.online_max_steps: 1000000
  train.eval_interval: 50000
