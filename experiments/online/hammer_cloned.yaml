name: fpot_online_hammer_cloned
description: Offline-to-online FPOT on D4RL hammer-cloned-v1 (1M offline + 1M online, seeds 1-8; CDQ=true)
wandb_project: fpot_online

sweep:
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: d4rl_adroit
  env.env_name: hammer-cloned-v1
  agent: fpot
  agent.w_temperature: 50
  agent.eta_temperature: 0.001
  agent.q_agg: min
  agent.use_vabc_td_target: false
  agent.discount: 0.99
  train: offline_to_online
  train.offline_max_steps: 1000000
  train.online_max_steps: 1000000
  train.eval_interval: 50000
