name: fpot_online_hammer_cloned
description: Offline-to-online FPOT on D4RL hammer-cloned-v1 (1M+1M, seeds 1-8; CDQ=true)
env_set: d4rl
wandb_project: fpot_online

sweep:
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: d4rl_adroit
  env.env_name: hammer-cloned-v1
  agent: fpot
  agent.w_temperature: 50
  agent.eta_temperature: 0.001
  agent.q_agg: min
  agent.use_vabc_td_target: false
  agent.discount: 0.99
  train: offline_to_online
  train.offline_max_steps: 1000000
  train.online_max_steps: 1000000
  train.eval_interval: 50000

slurm:
  time: "72:00:00"
  mem: "64G"
  cpus_per_task: 20
  qos: big_qos
  partitions:
    - base_suma_rtx3090
    - big_suma_rtx3090
    - dell_rtx3090
    - suma_rtx4090
    - suma_a6000
    - gigabyte_a6000
    - gigabyte_a5000
    - asus_6000ada
    - asus_a5000
    - tyan_a6000
