name: e009_nm_ablation_cube_double
description: FPOT N×M ablation on cube_double_play_task2 — 3 N × 4 M × 8 seeds = 96 jobs
env_set: ogbench

sweep:
  agent.n_student: [4, 16, 32]
  agent.n_teacher: [4, 16, 64, 256]
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: cube_double_play_task2
  agent.agent_file: agent_fpot
  agent.q_agg: mean
  agent.use_vabc_td_target: true
  agent.w_temperature: 2.0
  agent.eta_temperature: 1e-2
  train.batch_size: 256
  train.max_steps: 1000000
  train.eval_interval: 20000
  eval.num_eval_episodes: 100
  logging.save_checkpoint: false

slurm:
  time: "48:00:00"
  mem: "32G"
  cpus_per_task: 4
  qos: big_qos
  partitions:
    - big_suma_rtx3090
    - base_suma_rtx3090
    - dell_rtx3090
    - suma_rtx4090
    - suma_a6000
    - gigabyte_a6000
    - gigabyte_a5000
    - asus_6000ada
    - tyan_a6000
    - asus_a5000
