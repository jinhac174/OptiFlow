name: e021_fpot_cube_single_main
description: FPOT main run on cube-single-play tasks 1-5, seeds {1, 5}, 1M offline steps
env_set: ogbench
wandb_project: fpot-cube-single-main

# 5 envs × 2 seeds = 10 jobs
sweep:
  env:
    - cube_single_play_task1
    - cube_single_play_task2
    - cube_single_play_task3
    - cube_single_play_task4
    - cube_single_play_task5
  seed: [1, 5]

fixed:
  agent.agent_file: agent_fpot
  # ---- Paper hparams_ogbench (Table 4): cube-single FPOT (tau, eta) = (2.0, 1e-1) ----
  agent.w_temperature: 2.0
  agent.eta_temperature: 1e-1
  # ---- Paper FPOT_hparams_override (Table 3): cube-single uses VaBC TD target ----
  agent.use_vabc_td_target: true
  # ---- Shared defaults (Table 2) ----
  agent.q_agg: mean
  # ---- Training: 1M steps for state-based OGBench (paper Sec. 5.2) ----
  train.max_steps: 1000000
  train.eval_interval: 20000
  train.save_interval: 1000000
  logging.save_checkpoint: true

slurm:
  time: "72:00:00"
  mem: "64G"
  cpus_per_task: 20
  qos: big_qos
  # Only partitions that allow big_qos. Excluded: suma_a100 (a100_qos),
  # asus_pro6000 / suma_pro6000 (pro6000_qos). Submit separately if you want those.
  partitions:
    - base_suma_rtx3090
    - big_suma_rtx3090
    - dell_rtx3090
    - suma_rtx4090
    - suma_a6000
    - gigabyte_a6000
    - gigabyte_a5000
    - asus_6000ada
    - asus_a5000
    - tyan_a6000
