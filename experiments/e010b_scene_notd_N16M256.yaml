name: e010b_scene_notd_N16M256
description: FPOT scene_play_task2, no TD backup, N=16 M=256, 8 seeds
env_set: ogbench
wandb_project: flowrl-ogbench-nm-scene

sweep:
  agent.n_student: [16]
  agent.n_teacher: [256]
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: scene_play_task2
  agent.agent_file: agent_fpot
  agent.q_agg: mean
  agent.use_vabc_td_target: false
  agent.w_temperature: 2.0
  agent.eta_temperature: 1e-1
  train.batch_size: 256
  train.max_steps: 1000000
  train.eval_interval: 20000
  eval.num_eval_episodes: 100
  logging.save_checkpoint: false
