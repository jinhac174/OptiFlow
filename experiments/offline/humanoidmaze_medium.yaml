name: fpot_offline_humanoidmaze_medium
description: Offline-only FPOT on humanoidmaze-medium-navigate-task1, 1M steps, 8 seeds (saves final_agent for resume-online debug)
wandb_project: fpot_offline_for_resume

sweep:
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: ogbench_state
  env.env_name: humanoidmaze-medium-navigate-singletask-task1-v0
  agent: fpot
  agent.w_temperature: 1.0
  agent.eta_temperature: 0.001
  agent.q_agg: mean
  agent.use_vabc_td_target: true
  agent.discount: 0.995
  train: offline
  train.max_steps: 1000000
  train.eval_interval: 50000
  logging.save_checkpoint: true
