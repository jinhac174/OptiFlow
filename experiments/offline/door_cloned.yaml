name: fpot_offline_door_cloned
description: Offline-only FPOT on D4RL door-cloned-v1, 1M steps, 8 seeds (saves final_agent for resume-online debug; CDQ=true)
wandb_project: fpot_offline_for_resume

sweep:
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  env: d4rl_adroit
  env.env_name: door-cloned-v1
  agent: fpot
  agent.w_temperature: 1.0
  agent.eta_temperature: 1e-06
  agent.q_agg: min
  agent.use_vabc_td_target: false
  agent.discount: 0.99
  train: offline
  train.max_steps: 1000000
  train.eval_interval: 50000
  logging.save_checkpoint: true
