name: e017_offline_cube_double_t3
description: Offline FPOTAgent — cube-double-play task3, 3 seeds, 1M steps with snapshot
env_set: ogbench

# 1 env × 3 seeds = 3 jobs
sweep:
  env:
    - cube_double_t3
  seed: [1, 2, 3, 4, 5, 6, 7, 8]

fixed:
  agent.agent_file: agent_fpot
  agent.w_temperature: 2.0
  agent.eta_temperature: 1e-2
  agent.q_agg: mean
  agent.use_vabc_td_target: true
  train.max_steps: 1000000
  train.save_interval: 1000000
  train.eval_interval: 50000
  logging.save_checkpoint: true
  logging.wandb_project: fpot-offline-snapshot-cube-double-t3

slurm:
  time: "72:00:00"
  mem: "64G"
  cpus_per_task: 20
  partitions:
    - base_suma_rtx3090
    - suma_rtx4090
