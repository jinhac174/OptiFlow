name: e003_fpot_cube_triple_vabc
description: fpot + VaBC TD backup on cube_triple_play — wt sweep, 5 tasks × 2 configs × 2 seeds
env_set: ogbench
wandb_project: flowrl-ogbench

# 2 wt × 5 tasks × 2 seeds = 20 jobs
sweep:
  agent.w_temperature: [1.0, 2.0]
  env:
    - cube_triple_play_task1
    - cube_triple_play_task2
    - cube_triple_play_task3
    - cube_triple_play_task4
    - cube_triple_play_task5
  seed: [1, 2]

fixed:
  agent.agent_file: agent_fpot
  agent.eta_temperature: 0.01
  agent.q_agg: mean
  agent.use_vabc_td_target: true
  train.batch_size: 256
  train.max_steps: 500000

slurm:
  time: "48:00:00"
  mem: "32G"
  cpus_per_task: 4
  partitions:
    - base_suma_rtx3090
    - suma_rtx4090
  exclude:
    - node04
    - node08
    - node18
    - node31
