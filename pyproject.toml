[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpot"
version = "0.1.0"
description = "Flow Policy via Optimal Transport"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [{ name = "FPOT authors" }]

# Single environment that hosts both OGBench (gymnasium / mujoco 3.x) and D4RL
# (gym 0.23 / mujoco_py 2.1) stacks side by side. mujoco_py also requires the
# MuJoCo 2.1 binary on disk (~/.mujoco/mujoco210); see README for the curl step.
dependencies = [
    # ---- JAX / Flax stack ----
    "jax[cuda12]==0.6.2",
    "flax==0.10.2",
    "optax==0.2.5",
    "distrax==0.1.5",
    "ml-collections==1.1.0",
    "absl-py==2.4.0",
    "numpy==1.26.4",
    # ---- Hydra / config / IO ----
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "PyYAML==6.0.2",
    "h5py==3.16.0",
    "pillow==12.1.1",
    "tqdm==4.67.3",
    "wandb==0.25.1",
    # ---- Modern MuJoCo (used by OGBench / dm_control) ----
    "mujoco==3.3.7",
    # ---- OGBench ----
    "ogbench==1.2.1",
    "gymnasium>=1.2.0",
    "gymnasium-robotics==1.4.2",
    # ---- D4RL (legacy gym 0.23 + mujoco_py 2.1) ----
    "gym==0.23.1",
    "shimmy[gym-v21]",
    "Cython<3",
    "mujoco_py==2.1.2.14",
    "d4rl @ git+https://github.com/Farama-Foundation/d4rl@master",
]

[project.urls]
Homepage = "https://github.com/jinhac174/FPOT"

[tool.setuptools.packages.find]
include = ["fpot*", "envs*"]
